# Publishes the `deploy` branch the cPanel server auto-pulls
# (docs/auto-deploy.md). Every push to main:
#   1. runs the backend test suite (the stable subset — fixture-dependent and
#      live-network tests are excluded, matching what passes from a clean
#      checkout),
#   2. typechecks + builds the frontend,
#   3. force-pushes `deploy` = this commit + the built `frontend/dist`
#      committed on top (dist is gitignored on main; the server needs it
#      prebuilt because cPanel has no Node).
# A failing test or build blocks the deploy branch from updating — the live
# site simply stays on the previous good build.

name: Publish deploy branch

on:
  push:
    branches: [main]

concurrency:
  group: deploy-branch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run tests (stable subset)
        env:
          PYTHONUTF8: "1"
        # Excluded: test_timetable.py needs an untracked local fixture
        # (fixtures/ttb_getPageableCourses_sample.json, never committed);
        # "live_smoke" tests hit real UofT endpoints.
        # test_programs.py IS included — its corpus-dependent tests skip
        # themselves when the gitignored corpus is absent, so the program-type
        # classification regression tests run here.
        run: >
          python -m pytest backend/tests -q
          --ignore=backend/tests/test_timetable.py
          -k "not live_smoke"

  publish:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Force-push deploy branch (main + built dist)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B deploy
          git add -f frontend/dist
          git commit -m "Deploy build of ${GITHUB_SHA::9}"
          git push -f origin deploy
