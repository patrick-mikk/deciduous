<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Theme flash guard: read the persisted/OS theme choice and stamp it on <html>
      before React (and its stylesheets) paint anything. ThemeProvider (src/theme)
      takes over from here and keeps this in sync.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("deciduous:theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <title>Deciduous — UofT Degree Planner</title>

  </head>

  </body>
</html>
